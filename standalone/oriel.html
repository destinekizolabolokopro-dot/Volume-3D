     * c'\xE9tait intenable \u2014 dans un puits de quarante-trois m\xE8tres pris en
     * diagonale, la surface la plus proche est d\xE9j\xE0 \xE0 dix-sept m\xE8tres, donc
     * *tout* tombait au-del\xE0 du seuil. Le plan de la mont\xE9e ne montrait qu'un
